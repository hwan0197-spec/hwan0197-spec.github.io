<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Pretendard,sans-serif;background:#fcfbf9;color:#1d1c1a;padding:80px 90px;position:relative;word-break:keep-all}
.brand{font-size:30px;font-weight:600;letter-spacing:-.02em}.brand b{color:#2f6b5a}
h1{margin-top:70px;font-size:66px;line-height:1.28;letter-spacing:-.04em;font-weight:800}
h1 em{font-style:normal;color:#2f6b5a}
p{margin-top:30px;font-size:28px;color:#6a655e;letter-spacing:-.02em}
.bar{position:absolute;left:0;bottom:0;width:100%;height:18px;background:#2f6b5a}
.chips{position:absolute;right:90px;top:80px;display:flex;gap:10px}
.chips span{background:#e6f0ec;color:#2f6b5a;font-size:22px;font-weight:600;padding:8px 18px;border-radius:999px}
</style></head><body>
<div class="brand">작은가게 <b>웹 가이드</b></div>
<div class="chips"><span>랜딩페이지</span><span>상담 폼</span><span>자동화</span></div>
<h1>가게 홍보에 필요한 웹 도구,<br><em>쉽게 설명해 드립니다</em></h1>
<p>1인 사업자와 소상공인을 위한 실전 가이드</p>
<div class="bar"></div>
</body></html>
